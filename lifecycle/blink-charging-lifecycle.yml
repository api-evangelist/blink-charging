summary: >-
  Blink Charging publishes no API lifecycle policy of any kind: no versioning scheme, no
  deprecation policy, no Sunset/Deprecation header commitment, no SLA and no status page. What the
  repo CAN record is an observed lifecycle: a named developer programme (BlinkMap API) that was
  retired without notice, and a gateway path that now answers with an OCPI support gate.

versioning:
  scheme: not published
  current: null
  docs: null
  observed: >-
    The retired BlinkMap API used a URI-path version (api.blinknetwork.com/map/v1). Today ANY
    /map-prefixed path on the gateway returns the same 503, so no version is negotiable and no
    version discovery (/map/versions, /ocpi/versions) is reachable.


  observed_retirements:
  - surface: BlinkMap API developer programme
    url: https://prod.blinknetwork.com/developer.html
    retired: 'observed between 2021-07-28 and today'
    evidence: >-
      Wayback CDX shows snapshots from 2014-06-25 through 2021-07-28 and none after. The host now
      refuses connections (curl 000; ECONNREFUSED 51.143.59.97:443 from a second vantage point).
      blinknetwork.com/developer.html redirects to host.blinknetwork.com/developer.html, which
      serves the 959-byte React SPA shell.
    notice_given: none found - no deprecation notice, migration guide or sunset date was ever
      published on blinkcharging.com.
  - surface: BlinkMap / OCPI route on the public gateway
    url: https://api.blinknetwork.com/map/v1
    status: >-
      HTTP 503 with {"status": 503, "error": "Service Unavailable", "message": "This service is
      currently unavailable. Please contact support if you need access to OCPI."} - a route that
      exists but is switched off for anonymous callers and redirected to a human support gate.


name: Blink Charging
kind: company
description: >-
  Blink Charging Co. (Nasdaq BLNK) is a United States electric vehicle charging company
  headquartered at 17301 Melford Boulevard, Bowie, Maryland, with additional offices in
  California, the United Kingdom, Belgium and India. It designs and sells Level 2 and DC fast
  chargers (Series 7, 8 and 9, Shasta, the EQ/PQ line and the HYC DC fast chargers), owns and
  operates chargers under both owner-operator and host-owned business models, and runs the Blink
  Network - the proprietary cloud platform behind its host portal, driver mobile app and fleet
  management product. In the energy value chain Blink is a charge point operator and a load on
  the distribution grid, not a utility, retailer or system operator. It publishes no electricity
  usage, tariff, grid or market data of its own, and no consumer energy data right obligation
  applies to it in its home market of the United States - Green Button is a voluntary NAESB/NIST
  standard aimed at utilities, and Blink is not a utility. Its API posture is a closed door
  behind a live legal surface. The Blink Network Terms and Conditions, last modified 2 December
  2025, explicitly govern "the Blink API" and state that use is "under your username", but no
  live developer portal, API reference, base URL or machine-readable contract is published
  anywhere on blinkcharging.com. The historical BlinkMap API developer page at
  prod.blinknetwork.com/developer.html - an application form gated by a Blink Network, LLC Data
  License Agreement - now refuses connections and was last archived in July 2021. The only live
  data-access surface Blink publishes is a United Kingdom open data request page citing the
  Public Charge Point Regulations 2023, where a Google Form request is reviewed by Blink's data
  team, shared with the aggregator Eco-Movement and answered "in api format" - an
  application-approval gate, not an open feed. Blink's real standards adoption sits below the API
  layer: OCPP 2.0.1 certification for its Series 7, 8 and 9 chargers announced September 2025,
  and OpenADR 2.0 approval for the Blink Network announced March 2020 enabling utility load
  management across its charging network.

duplicateWarning:
  isDuplicate: true
  survivorCandidate: undetermined - flag for the duplicate-provider-retirement process
  otherRepo: /Users/kinlane/GitHub/all/blink
  detail: >-
    An existing api-evangelist repo all/blink profiles THIS SAME COMPANY under aid "blink" - name
    "Blink Charging", Website https://blinkcharging.com, LinkedIn
    https://www.linkedin.com/company/blinkcharging, GitHubOrganization
    https://github.com/blinkcharging - created 2026-07-03 and already enriched with three apis[]
    entries (Locations, Search, Status), three AE-modeled OpenAPI documents plus an _original,
    agentic-access, authentication, security, screenshots and kin score files. This repo
    (blink-charging) was created by the energy sector sweep against the blinkcharging.com domain.
    The two should be merged rather than both published.
  materialDifferencesToReconcile:
  - >-
    all/blink lists three APIs with baseURL https://api.blinknetwork.com/map/v1 and Documentation
    https://prod.blinknetwork.com/developer.html. Both were re-probed on 2026-07-27: the base URL
    returns 503 from an AWS ALB named "demo-alb-...", and the documentation host refuses
    connections entirely. Those pointers are stale and should be corrected or retired on the
    survivor.
  - >-
    all/blink tags the company only as EV Charging / mobility. This repo places it in the Energy &
    Utilities sector with the mandate, standards and consumer-versus-market analysis that sector
    work requires. The survivor should carry both tag sets.
  - >-
    all/blink's accessModel says onboarding "self-serve" with confidence medium. That is wrong on

harvest:
  specs: []
  totalSpecs: 0
  openapiDirectoryCreated: false
  reason: >-
    Nothing real was found to save. No OpenAPI, AsyncAPI, JSON Schema, Postman collection, OCPI
    descriptor or any other machine-readable artifact is published by Blink Charging on any host
    probed. The openapi/ directory was deliberately omitted rather than filled with a model.
  explicitlyNotHarvested:
  - artifact: all/blink/openapi/*.yml (three documents)
    reason: >-
      Those are AE-MODELED, not harvested. Their own info.description says they were "modeled from
      a historical official Blink API Map PDF (dated January 2014)" via the unofficial third-party
      Ruby client github.com/conarro/blink_api, and that "Paths, parameter names, and response
      fields are NOT independently re-verified". Copying them into this repo would misrepresent a
      model as a provider-published contract.
  - artifact: github.com/conarro/blink_api
    reason: >-
      Unofficial third-party Ruby wrapper from 2014. Real evidence that a BlinkMap API once
      existed and was callable, but it is not a Blink artifact and is not listed in apis.yml.

apiFamilySegmentation:
  note: >-
    Blink does not segment an API family, because it does not publish one. What follows is the
    product segmentation its own pages use, recorded so a later enrichment pass knows where an API
    would sit if one were ever published.
  segments:
  - name: Driver
    surface: Blink mobile app - find stations, start/pause/end/restart a session, view charging speed, energy delivered, session duration and estimated cost. Customer login only.
  - name: Host
    surface: Blink Network host portal (host.blinknetwork.com, host.blinknetwork.eu) - reports, flexible pricing, real-time charge event monitoring. Customer login only.
  - name: Fleet
    surface: Blink fleet management - advanced fleet reporting and monitoring; partner integrations with Presto, BetterFleet, WEX, dfYOUNG described in news releases as API integrations but with no public reference.
  - name: Roaming
    surface: Third-party networks - Hubject Intercharge, Eco-Movement, Paua, plus driver access via ChargePoint, ChargeHub, Shell Recharge and automaker apps. Brokered, not self-published.
  - name: Grid / demand response
    surface: OpenADR 2.0 approved Blink Network for utility load management control. No public onboarding.
  - name: Open data (UK only)
    surface: PCPR 2023 charge point location, availability and usage data, by Google Form request.

findings:
  summary: |
    Blink Charging is the cleanest possible illustration of the sector's central question read
    from the other end. There is no mandate to confuse with an implementation in its home market
    at all - the United States imposes no consumer energy data right on anyone, let alone on an EV
    charging network, and Green Button is a voluntary utility standard that has nothing to say
    about a charge point operator. So the interesting mandate is the one that DOES bind Blink, in
    a different jurisdiction and over a different dataset: the UK Public Charge Point Regulations
    2023 require public charge point operators to open their location, availability and usage
    data. Blink's answer to that legal requirement is a Google Form.

    That is the finding worth carrying forward. The regulation is real, Blink's page cites it by
    name, and Blink asserts compliance with the reliability limb of it in a footnote. But the
    open-data limb is met with "provide your contact details and specify the type of data you
    need", followed by human review by "the Blink Data team", followed by delivery "in api format"
    on "a stipulated timeframe", with the request forwarded to a commercial aggregator,
    Eco-Movement. No endpoint. No licence. No schema. No format beyond the phrase "api format".
    A regulator can read that page and tick a box; a developer cannot write a line of code against
    it. Mandate: yes. Implementation: unverifiable. That gap is the whole point.

    On its own API posture Blink is not merely undocumented, it is regressive. It had a named
    developer program - the BlinkMap API - with a public landing page, a described data product
    (charger locations, hours of operation, network status), a request form and a data licence
    agreement. That page is archived from 2014 through July 2021 and then stops, and the host now
    refuses connections. The Blink Network migrated to Azure and to a React single-page host
    portal, and the developer surface did not migrate with it. Today the only trace of an API in
    Blink's own words is a clause in its terms of service: section 8 of the Blink Network Terms
    and Conditions, last modified 2 December 2025, governs "the Blink API" and says you are
    responsible for all use of it "under your username". A live legal contract for a surface with
    no public documentation is a strange artifact, and it is the strongest evidence available that
    an account-credentialed Blink API exists and is simply not published.

    The consumer/market split is closed on both axes, which for this tier is expected and still
    worth stating. Blink holds no metered premises data, so there is no consumer energy data
    right to implement. It publishes no grid or market data because it has none - it is load, not
    a market participant. What it does hold that has public value is the charge point availability
    dataset, and that is precisely the dataset a regulator reached for and precisely the one Blink
    keeps behind a form.
  standardsPosture: >-
    Real adoption, all of it below the API layer. OCPP 2.0.1 certification (2025-09-16, Series 7,
    8 and 9) governs charger-to-backend, and OpenADR 2.0 approval (2020-03-17) governs
    utility-to-network load management - both genuine, both invisible to a developer. Roaming
    reaches drivers through Hubject Intercharge, Eco-Movement and Paua rather than through a Blink
    OCPI endpoint. Zero references to Green Button, ESPI, NAESB, IEEE 2030.5 or CIM anywhere on
    the public surface. The Blink Network product page describes the platform as "proprietary
    cloud-based" and names no protocol whatsoever.
  governanceObservations:
  - The Blink Network Terms and Conditions govern an API that has no published documentation, no base URL and no reference - a live legal surface over an invisible technical one.
  - Every path on host.blinknetwork.com returns the same 959-byte SPA shell with HTTP 200, so naive spec-discovery tooling will record false positives for openapi.json, swagger.json, api-docs and .well-known/openid-configuration. All were verified by content length and Content-Type and recorded as soft 200s.
  - api.blinknetwork.com resolves through apigw.blinknetwork.com to an AWS ALB whose hostname is literally "demo-alb-1920973694.us-east-1.elb.amazonaws.com" and which returns 503 on the historical /map/v1 base path.
  - No .well-known/security.txt and no published vulnerability disclosure route on the primary domain.
  - The company's own GitHub organisation profile carries a stale headquarters location (Miami Beach, FL) relative to its live company page (Bowie, MD).
  - The UK open-data obligation is discharged through a Google Form on a third-party domain rather than any Blink-controlled machine interface.

